        .container {
            max-width: 1200px;
            margin: 0 auto;

        }

        }

        }

            border-radius: 8px;

            text-align: center;
        }
        .service-bar h2 {
            color: #007bff;
            margin: 0;
        }
        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 10px 0;

        }
    </style>
</head>

    <header>

    <div class="container">

            <h2>Cuidados Integrales</h2><button onclick="window.location.href='https://siempre-cuidados.github.io/cuidadoras/'" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                click aqui 
            </button>
        </div>

            <h2>Auxiliar de Enfermería</h2><button onclick="window.location.href='https://siempre-cuidados.github.io/Auxiliar-de-Enfermeria/'" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">

        </div>

        <div class="service-bar">
            <h2>Enfermera</h2><button onclick="window.location.href='https://siempre-cuidados.github.io/servicios/'" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                click aqui

        </div>
    </div>

    <footer>
